name: network-probe
on:
  push:
    branches: [feature/menu-sheets-github]
    paths: [tools/network_probe.py, .github/workflows/network-probe.yml]
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12", cache: pip}
      - run: pip install -r requirements.txt
      - run: python tools/network_probe.py
